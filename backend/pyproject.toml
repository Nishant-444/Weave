[project]
name = "weave-rag-backend"
version = "1.0.0"
description = "FastAPI backend for Weave PDF and CSV RAG System with deterministic citations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "google-genai>=0.1.1",
    "groq>=0.11.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
